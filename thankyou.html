<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#FFF8F2">
  <title>Order Request Received | DERMOCARE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Halant:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --orange: #EF6C00; --peach: #FFE0B2; --paper: #FFF8F2; --ink: #2C2C2C; --green: #388E3C; --white: #FFFFFF; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 22px; display: grid; place-items: center; background: var(--peach); color: var(--ink); font: 18px/1.55 "Halant", "Noto Serif Devanagari", serif; }
    main { width: min(100%, 450px); padding: 28px 24px; background: var(--paper); text-align: center; }
    .wordmark { margin-bottom: 20px; color: var(--ink); font-size: 18px; font-weight: 700; letter-spacing: .04em; }
    .wordmark span { color: var(--orange); }
    .product { width: 100%; height: 220px; margin: 0 auto 20px; object-fit: contain; }
    .check { width: 54px; height: 54px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 50%; background: var(--green); color: var(--white); }
    .check .icon { width: 30px; height: 30px; stroke-width: 2.5; }
    h1 { margin: 0 0 8px; color: var(--green); font-size: 31px; line-height: 1.3; }
    p { margin: 0 0 12px; }
    .next { color: var(--orange); font-weight: 600; }
    .order-ref { color: var(--green); font-size: 14px; }
    a { min-height: 48px; margin-top: 10px; padding: 10px 18px; display: inline-flex; align-items: center; justify-content: center; background: var(--orange); color: var(--white); font-weight: 700; text-decoration: none; transition: background .2s ease, transform .2s ease; }
    a:hover { transform: translateY(-2px); background: var(--green); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <div class="wordmark">DERMO<span>CARE</span></div>
    <img class="product" src="Image/4.avif" alt="DERMOCARE Skin Care Kit">
    <div class="check" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></div>
    <h1>धन्यवाद!</h1>
    <p>आपका order request प्राप्त हुआ।</p>
    <p class="next">हमारी team order confirmation के लिए आपसे संपर्क करेगी।</p>
    <p class="order-ref" id="order-ref" hidden></p>
    <a href="index.html">DERMOCARE पर वापस जाएँ</a>
  </main>
  <script>
    document.addEventListener("contextmenu", (event) => event.preventDefault());
    document.addEventListener("wheel", (event) => {
      if (event.ctrlKey) event.preventDefault();
    }, { passive: false });
    document.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && ["+", "=", "-", "0", "_"].includes(event.key)) {
        event.preventDefault();
      }
    });

    const orderId = new URLSearchParams(window.location.search).get("order_id");
    if (orderId) {
      const reference = document.querySelector("#order-ref");
      reference.textContent = `Order reference: ${orderId}`;
      reference.hidden = false;
    }
  </script>
</body>
</html>
